[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
kiva_sim = ["maps/*.xlsx"]

[project]
name = "kiva-sim"
version = "0.0.2"
description = "Kiva system simulation project"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    {name = "Zhengcy", email = "zhengcy24@mails.tsinghua.edu.cn"}
]
keywords = ["simulation", "kiva", "spatial-temporal A* algorithm", "cbs algorithm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    # "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "matplotlib",
    "numpy",
    "openpyxl",
    "pandas",
    "seaborn",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "black",
    "ruff",
    "mypy",
]
colors = ["rich"]
all = ["kiva-sim[dev, colors]"]

[project.urls]
Homepage = "https://github.com/Dexter6268"
Repository = "https://github.com/Dexter6268/Kiva-system-simulation"
Issues = "https://github.com/Dexter6268/Kiva-system-simulation/issues"

# [tool.setuptools]
# packages = ["kiva_sim"]


[tool.black]
line-length = 119