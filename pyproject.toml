[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kiva-system-simulation"
version = "0.1.0"
description = "Kiva system simulation project"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Zhengcy", email = "00dexter626@gmail.com"}
]
keywords = ["simulation", "kiva", "warehouse"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    # Add your dependencies from requirements.txt here
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "black",
    "flake8",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/Dexter6268/Kiva-system-simulation"
Repository = "https://github.com/Dexter6268/Kiva-system-simulation"
Issues = "https://github.com/Dexter6268/Kiva-system-simulation/issues"

[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-dir]
"" = "src"